<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · {{BUSINESS_NAME}}</title>
<meta name="description" content="{{CONTACT_DESCRIPTION}}">
<link rel="canonical" href="{{SITE_ORIGIN}}/contact/">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap bar">
<a class="brand" href="../">{{BUSINESS_NAME}}</a>
<nav aria-label="Pages">
<a href="../">Home</a>
<a href="../services/">Services</a>
<a href="../about/">About</a>
<a href="./" aria-current="page">Contact</a>
<a href="../{{FIFTH_PATH}}">{{FIFTH_LABEL}}</a>
</nav>
</div></header>
<main id="main">
<section><div class="wrap">
<h1>Contact {{BUSINESS_NAME}}</h1>
<div class="pre">{{CONTACT_DETAILS}}</div>
<form action="https://api.web3forms.com/submit" method="post">
<input type="hidden" name="access_key" value="{{WEB3FORMS_ACCESS_KEY}}">
<input type="hidden" name="subject" value="Enquiry for {{BUSINESS_NAME}}">
<input type="hidden" name="redirect" value="{{SITE_ORIGIN}}/thanks.html">
<label for="sender-name">Your name<input id="sender-name" name="name" type="text" autocomplete="name" required></label>
<label for="sender-email">Email<input id="sender-email" name="email" type="email" autocomplete="email" required></label>
<label for="sender-message">Message<textarea id="sender-message" name="message" rows="6" required></textarea></label>
<button type="submit">Send</button>
</form>
</div></section>
</main>
<footer><div class="wrap"><p>{{BUSINESS_NAME}}. {{AREA}}.</p></div></footer>
</body>
</html>
